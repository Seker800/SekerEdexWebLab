name: Deploy production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on:
      - self-hosted
      - linux
      - x64
      - seker-edex-deploy
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      CONTENT_ROOT: /volume1/homes/AI/SekerEdexContent/blog
      OSS_BUCKET: seker-edex-web
      OSS_ENDPOINT: oss-cn-beijing.aliyuncs.com
      OSS_REGION: cn-beijing
      PUBLIC_ORIGIN: https://www.seker.wang

    steps:
      - name: Check out the verified revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          clean: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Require the NAS-only content root
        run: test -d "$CONTENT_ROOT"

      - name: Install dependencies
        run: npm ci

      - name: Validate the application
        run: |
          npm run check
          npm test

      - name: Build with NAS-only content
        env:
          SEKER_CONTENT_ROOT: ${{ env.CONTENT_ROOT }}
        run: |
          npx tsc -p tsconfig.build.json
          build_log="$RUNNER_TEMP/seker-edex-private-build.log"
          if ! npx vite build apps/clone --outDir ../../dist/clone --emptyOutDir --logLevel error >"$build_log" 2>&1; then
            echo "The private content build failed. Inspect the build log on the NAS runner." >&2
            exit 1
          fi
          rm -f "$build_log"

      - name: Record the deployed revision
        run: |
          node -e 'const fs=require("node:fs");fs.writeFileSync("dist/clone/deployment.json",JSON.stringify({revision:process.env.DEPLOY_SHA})+"\n")'

      - name: Obtain temporary Alibaba Cloud credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1
        with:
          oidc-provider-arn: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ALIYUN_DEPLOY_ROLE_ARN }}
          role-session-name: seker-edex-${{ github.run_id }}
          role-session-expiration: 1800

      - name: Upload immutable assets first
        run: |
          export OSS_ACCESS_KEY_ID="${ALIBABA_CLOUD_ACCESS_KEY_ID:?}"
          export OSS_ACCESS_KEY_SECRET="${ALIBABA_CLOUD_ACCESS_KEY_SECRET:?}"
          export OSS_SESSION_TOKEN="${ALIBABA_CLOUD_SECURITY_TOKEN:?}"
          "$HOME/.local/bin/ossutil" sync dist/clone/assets/ \
            "oss://$OSS_BUCKET/assets/" \
            --endpoint "$OSS_ENDPOINT" \
            --force

      - name: Upload static files except the entry point
        run: |
          export OSS_ACCESS_KEY_ID="${ALIBABA_CLOUD_ACCESS_KEY_ID:?}"
          export OSS_ACCESS_KEY_SECRET="${ALIBABA_CLOUD_ACCESS_KEY_SECRET:?}"
          export OSS_SESSION_TOKEN="${ALIBABA_CLOUD_SECURITY_TOKEN:?}"
          "$HOME/.local/bin/ossutil" sync dist/clone/ \
            "oss://$OSS_BUCKET/" \
            --endpoint "$OSS_ENDPOINT" \
            --force \
            --exclude "assets/*" \
            --exclude "index.html"

      - name: Publish the entry point last
        run: |
          export OSS_ACCESS_KEY_ID="${ALIBABA_CLOUD_ACCESS_KEY_ID:?}"
          export OSS_ACCESS_KEY_SECRET="${ALIBABA_CLOUD_ACCESS_KEY_SECRET:?}"
          export OSS_SESSION_TOKEN="${ALIBABA_CLOUD_SECURITY_TOKEN:?}"
          "$HOME/.local/bin/ossutil" cp dist/clone/index.html \
            "oss://$OSS_BUCKET/index.html" \
            --endpoint "$OSS_ENDPOINT" \
            --force \
            --cache-control "no-cache"

      - name: Refresh CDN
        run: >-
          "$HOME/.local/bin/aliyun" cdn RefreshObjectCaches
          --ObjectPath "$PUBLIC_ORIGIN/"
          --ObjectType Directory

      - name: Verify the public deployment
        run: |
          for attempt in 1 2 3 4 5 6; do
            revision="$(curl --fail --silent --show-error "$PUBLIC_ORIGIN/deployment.json?revision=$DEPLOY_SHA" | node -pe 'JSON.parse(require("node:fs").readFileSync(0,"utf8")).revision' 2>/dev/null || true)"
            if [ "$revision" = "$DEPLOY_SHA" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "The public deployment did not expose the expected revision." >&2
          exit 1
