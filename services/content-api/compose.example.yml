services:
  content-api:
    build:
      context: ../..
      dockerfile: services/content-api/Dockerfile
    env_file: .env
    environment:
      CONTENT_DATA_DIR: /data
      CONTENT_LISTEN_HOST: 0.0.0.0
      CONTENT_REQUIRE_HTTPS: "true"
    ports:
      - "127.0.0.1:4175:4175"
    volumes:
      - "${CONTENT_HOST_DATA_DIR:?set_a_private_absolute_directory}:/data"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
