<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Content manager</title>
  <link rel="stylesheet" href="/admin/style.css">
  <script type="module" src="/admin/app.js"></script>
</head>
<body>
  <main>
    <header><h1>Content manager</h1><p>独立内容后台 · 新内容默认草稿，确认后再发布。</p></header>
    <p id="status" role="status" aria-live="polite"></p>
    <section aria-labelledby="editor-title">
      <h2 id="editor-title">文章或链接</h2>
      <form id="item-form">
        <label>类型 <select name="kind"><option value="document">Markdown 文章</option><option value="link">外部链接</option></select></label>
        <label>目录与路径 <input name="relativePath" required placeholder="journal/hello.md" autocomplete="off"></label>
        <label>标题 <input name="title" required maxlength="200"></label>
        <label>摘要 <input name="summary" maxlength="500"></label>
        <label class="document-field">发布日期 <input name="publishedAt" type="date"></label>
        <label class="document-field">标签（逗号分隔） <input name="tags"></label>
        <label class="document-field">Markdown 正文 <textarea name="markdown" rows="14" spellcheck="false"></textarea></label>
        <label class="link-field" hidden>HTTPS 链接 <input name="href" type="url" placeholder="https://"></label>
        <label>顺序（小的排前面） <input name="sortOrder" type="number" min="0" max="1000000" value="0" required></label>
        <label>状态 <select name="status"><option value="draft">草稿</option><option value="published">已发布</option></select></label>
        <div class="actions"><button type="submit">保存</button><button type="button" id="clear-form">新建</button></div>
      </form>
    </section>
    <section aria-labelledby="upload-title">
      <h2 id="upload-title">图片或视频</h2>
      <form id="media-form">
        <label>文件 <input name="file" type="file" accept="image/jpeg,image/png,image/gif,image/webp,image/avif,video/mp4,video/webm" required></label>
        <label>目录与路径 <input name="relativePath" required placeholder="photos/cover.webp"></label>
        <label>标题 <input name="title" required></label>
        <label>替代文本 / 视频说明 <input name="alt" required></label>
        <label>顺序 <input name="sortOrder" type="number" min="0" max="1000000" value="0" required></label>
        <button type="submit">上传为草稿</button>
      </form>
    </section>
    <section aria-labelledby="list-title"><h2 id="list-title">全部内容</h2><button type="button" id="reload">刷新</button><ul id="items"></ul></section>
  </main>
</body>
</html>
